<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9 - Calculadora</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
        }
        .calculadora {
            width: 260px;
            margin: 50px auto;
            padding: 15px;
            background-color: #34495e;
            border-radius: 15px;
        }
        .visor {
            width: 100%;
            height: 50px;
            margin-bottom: 15px;
            font-size: 26px;
            text-align: right;
            box-sizing: border-box;
            padding: 5px 10px;
            border: none;
            border-radius: 8px;
            background-color: #d5f5e3;
        }
        table {
            width: 100%;
        }
        button {
            width: 55px;
            height: 55px;
            font-size: 20px;
            border: none;
            border-radius: 50%;
            background-color: #ecf0f1;
            cursor: pointer;
        }
        .operacion {
            background-color: #f39c12;
            color: white;
        }
        .borrar {
            background-color: #e74c3c;
            color: white;
        }
        .igual {
            background-color: #27ae60;
            color: white;
        }
    </style>
</head>
<body>
    <div class="calculadora">
        <!-- Visor del resultado -->
        <input type="text" class="visor" id="visor" value="0" readonly>

        <!-- Botones -->
        <table>
            <tr>
                <td><button class="borrar">C</button></td>
                <td><button class="operacion">(</button></td>
                <td><button class="operacion">)</button></td>
                <td><button class="operacion">/</button></td>
            </tr>
            <tr>
                <td><button>7</button></td>
                <td><button>8</button></td>
                <td><button>9</button></td>
                <td><button class="operacion">*</button></td>
            </tr>
            <tr>
                <td><button>4</button></td>
                <td><button>5</button></td>
                <td><button>6</button></td>
                <td><button class="operacion">-</button></td>
            </tr>
            <tr>
                <td><button>1</button></td>
                <td><button>2</button></td>
                <td><button>3</button></td>
                <td><button class="operacion">+</button></td>
            </tr>
            <tr>
                <td><button>0</button></td>
                <td><button>.</button></td>
                <td><button class="operacion">%</button></td>
                <td><button class="igual">=</button></td>
            </tr>
        </table>
    </div>
</body>
</html>
