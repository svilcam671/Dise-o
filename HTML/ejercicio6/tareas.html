<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tareas</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./main.js" defer></script>
</head>
<body>
  <header>
    <h1>Gestor de tareas</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="tareas.html">Tareas</a>
      <a href="enlaces.html">Enlaces</a>
    </nav>
  </header>

  <main>
    <h2>Nueva tarea</h2>

    <form id="formTarea">
      <p>
        <label for="nombre">Tarea:</label>
        <input type="text" id="nombre" placeholder="Escribe una tarea" required>
      </p>
      <p>
        <label for="fecha">Fecha límite:</label>
        <input type="date" id="fecha" required>
      </p>
      <p>
        <label for="prioridad">Prioridad:</label>
        <select id="prioridad">
          <option>Baja</option>
          <option selected>Media</option>
          <option>Alta</option>
        </select>
      </p>
      <p>
        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" rows="3" placeholder="Opcional"></textarea>
      </p>
      <button type="submit">Agregar</button>
    </form>

    <h2>Mis tareas</h2>
    <ul id="lista"></ul>
  </main>

  <footer>
    <p>@Copyright Sergio</p>
  </footer>
</body>
</html>
