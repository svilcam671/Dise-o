<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora</title>
  <link rel="stylesheet" href="css/calculadora.css">
</head>
<body>
  <h1>Calculadora</h1>

  <table id="calculadora">
    <tr>
      <td colspan="4">
        <input type="text" id="pantalla" value="0" readonly>
      </td>
    </tr>
    <tr>
      <td><button class="rojo">C</button></td>
      <td><button class="gris">←</button></td>
      <td><button class="gris">%</button></td>
      <td><button class="naranja">÷</button></td>
    </tr>
    <tr>
      <td><button>7</button></td>
      <td><button>8</button></td>
      <td><button>9</button></td>
      <td><button class="naranja">×</button></td>
    </tr>
    <tr>
      <td><button>4</button></td>
      <td><button>5</button></td>
      <td><button>6</button></td>
      <td><button class="naranja">−</button></td>
    </tr>
    <tr>
      <td><button>1</button></td>
      <td><button>2</button></td>
      <td><button>3</button></td>
      <td><button class="naranja">+</button></td>
    </tr>
    <tr>
      <td><button>0</button></td>
      <td><button>.</button></td>
      <td colspan="2"><button class="verde ancho">=</button></td>
    </tr>
  </table>

  <script src="js/calculadora.js"></script>
</body>
</html>
