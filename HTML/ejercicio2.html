<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Más etiquetas</title>
</head>
<body background="FONDOS_PARA_WEB/paisaje.png">
    <!-- 1. Título principal -->
    <h1>Mis videojuegos favoritos</h1>

    <!-- 2. Subtítulo -->
    <h2>Una pequeña lista</h2>

    <!-- 3. Párrafo con texto en negrita y cursiva -->
    <p>Me gustan los juegos de <strong>aventura</strong> y los de <em>plataformas</em>.</p>

    <!-- 4. Lista ordenada -->
    <ol>
        <li>Hollow Knight</li>
        <li>The Legend of Zelda: Breath of the Wild</li>
        <li>BioShock Infinite</li>
    </ol>

    <!-- 5. Línea horizontal para separar -->
    <hr>

    <!-- 6. Lista sin orden -->
    <h2>Plataformas que uso</h2>
    <ul>
        <li>PC</li>
        <li>Nintendo Switch</li>
    </ul>

    <!-- 7. Salto de línea -->
    <p>Primera línea<br>Segunda línea</p>

    <!-- 8. Enlace -->
    <p>Más información en <a href="https://es.wikipedia.org/wiki/Videojuego" target="_blank">Wikipedia</a>.</p>

    <!-- 9. Imagen -->
    <img src="FONDOS_PARA_WEB/paisaje.png" alt="Paisaje" width="200">
</body>
</html>
